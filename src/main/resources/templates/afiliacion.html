<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sesión de Afiliación</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    h1 {
      text-align: center;
      padding: 20px;
      background: #0d6efd;
      color: white;
      margin: 0;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,.15);
    }

    .card h3 {
      margin-top: 0;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    tr:hover {
      background: #eef3ff;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      background: #0d6efd;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0b5ed7;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
    }

    .modal-content {
      background: white;
      width: 420px;
      margin: 120px auto;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .success { color: green; }
    .error { color: red; }
  </style>
</head>

<body>

<h1>Sesión de Afiliación de Clientes</h1>

<div class="container">

  <!-- CLIENTES -->
  <div class="card">
    <h3>Clientes</h3>
    <table id="tablaClientes">
      <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Ciudad</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- AFILIACIÓN -->
  <div class="card">
    <h3>Afiliar Cliente</h3>

    <p><strong>Cliente seleccionado:</strong></p>
    <input type="number" id="clienteId" readonly>

    <button onclick="afiliar()">Afiliar</button>
  </div>

  <!-- AFILIADOS -->
  <div class="card">
    <h3>Afiliaciones</h3>
    <ul id="listaAfiliados"></ul>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitulo"></h3>
    <p id="modalMensaje"></p>
    <button onclick="cerrarModal()">Cerrar</button>
  </div>
</div>

<script>
  // Cargar clientes al iniciar
  fetch("/ui/clientes")
          .then(res => res.json())
          .then(data => {
            const tbody = document.querySelector("#tablaClientes tbody");
            data.forEach(c => {
              const row = document.createElement("tr");
              row.innerHTML = `
                    <td>${c.id}</td>
                    <td>${c.nombre}</td>
                    <td>${c.edad}</td>
                    <td>${c.ciudad}</td>
                `;
              row.onclick = () => seleccionarCliente(c.id);
              tbody.appendChild(row);
            });
          });

  function seleccionarCliente(id) {
    document.getElementById("clienteId").value = id;
  }

  function afiliar() {
    const id = document.getElementById("clienteId").value;
    if (!id) return alert("Seleccione un cliente");

    fetch(`/api/afiliaciones/${id}`, { method: "POST" })
            .then(res => {
              if (!res.ok) {
                return res.json().then(e => { throw e });
              }
              return res.json();
            })
            .then(data => {
              mostrarModal("Afiliación Exitosa",
                      `Cliente ID ${data.clienteId} afiliado correctamente`, true);

              const li = document.createElement("li");
              li.innerText = `Cliente ${data.clienteId} → AFILIADO`;
              document.getElementById("listaAfiliados").appendChild(li);
            })
            .catch(err => {
              mostrarModal("Error de Afiliación",
                      err.message || "Cliente no cumple las condiciones", false);
            });
  }

  function mostrarModal(titulo, mensaje, ok) {
    document.getElementById("modalTitulo").innerText = titulo;
    document.getElementById("modalMensaje").innerText = mensaje;
    document.getElementById("modalTitulo").className = ok ? "success" : "error";
    document.getElementById("modal").style.display = "block";
  }

  function cerrarModal() {
    document.getElementById("modal").style.display = "none";
  }
</script>

</body>
</html>
